# Web app = Render Static Site. The existing API server is NOT changed.
# /api/* is proxied to your server, so the browser only talks to one origin (no CORS needed).
services:
  - type: web
    name: agrisense-web
    runtime: static
    rootDir: app
    buildCommand: npm install && npx expo export -p web
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.19.4
    routes:
      - type: rewrite
        source: /api/*
        destination: https://agrisense-3emj.onrender.com/api/*   # <- your API server's URL
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
